[project]
name = "microduck-football"
version = "0.1.0"
description = "Microduck football in simulation: privileged RL teacher -> LeRobot dataset -> ACT + DAgger camera student, plus 2v2 MAPPO self-play"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "BrouthenKamel" }]
keywords = ["robotics", "lerobot", "reinforcement-learning", "imitation-learning", "mujoco", "microduck", "football"]
dependencies = [
    "better-actuator-models>=1.0.3",
    "lerobot[all,core-scripts,feetech,smolvla,training]==0.7.0",
    "mlflow>=3.18.0",
    "onnxruntime>=1.32.0",
    "stable-baselines3>=2.9.2",
    "torch",
    "torchvision",
    "mujoco>=3.8",
    "gymnasium>=1.0",
    "numpy",
    "imageio[ffmpeg]",
    "pillow",
    "pygame",
    "matplotlib",
    "huggingface-hub",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microduck_football"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", rev = "62bd8ce12154340be97e06f7f41a0ca8f116d967" }
